<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>110 Mobile Tools — category and filters (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#1A5FD6}a:hover{color:#0B1F3A}
.r,.r *{box-sizing:border-box}
.r{font-family:Inter,system-ui,sans-serif;color:#0F172A;font-size:15px;line-height:1.5;background:#F4F6FA}
.h{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-0.01em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;white-space:nowrap}
.bp{background:#1A5FD6;color:#fff}.bs{background:#fff;color:#0B1F3A;border:1.5px solid #CBD5E1}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.b-in{background:#E3F4EA;color:#14532D}.b-low{background:#FFF1E0;color:#8A4200}.b-out{background:#E2E8F0;color:#334155}.b-sale{background:#F08A24;color:#0B1F3A}
.ph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:#EEF2F7;border:1.5px dashed #B6C2D2;border-radius:10px;color:#475569;font-size:11px;font-weight:500;text-align:center}
.m{color:#475569}
.pc{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#0F172A;font-size:13px}
.tb{flex:1;min-height:44px;border:1.5px solid #CBD5E1;border-radius:10px;background:#fff;font:inherit;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#0F172A}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;border-bottom:1px solid #F1F5F9}
.ck input{width:20px;height:20px;accent-color:#1A5FD6}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:#475569;text-decoration:none;min-height:52px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;background:#E6EEFC;color:#123E8C;font-size:12px;font-weight:600;border:0;font-family:inherit;cursor:pointer}
</style>
</helmet>
<div class="r" style="width: 390px; min-height: 1900px; position: relative; display: flex; flex-direction: column">
  <div style="background: #F08A24; color: #0B1F3A; font-size: 11px; font-weight: 700; text-align: center; padding: 3px 8px">PROPOSED CONCEPT — NOT A LIVE WEBSITE</div>
  <header style="background: #FFFFFF; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #E2E8F0">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="HomeMobile.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B1F3A; text-decoration: none; font-size: 22px">←</a>
      <h1 class="h" style="font-size: 19px; flex: 1">Soldering</h1>
      <a href="CheckoutMobile.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none; min-height: 44px; display: flex; align-items: center; padding: 0 8px">Cart (2)</a>
    </div>
    <div style="height: 44px; border: 1.5px solid #CBD5E1; border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #64748B; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search in Soldering</div>
    <div style="display: flex; gap: 8px">
      <button type="button" class="tb" onClick="{{open}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filters{{filterCount}}</button>
      <label class="tb" style="position: relative">Sort: Featured<select aria-label="Sort" style="position: absolute; inset: 0; opacity: 0"><option>Featured</option><option>Newest</option><option>Price: low to high</option><option>Price: high to low</option></select></label>
    </div>
  </header>

  <div style="padding: 10px 12px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
    <span class="m" style="font-size: 13px">{{count}} sample products</span>
    <sc-if value="{{inStock}}" hint-placeholder-val="{{false}}"><button type="button" class="pill" onClick="{{dropStock}}">In stock ✕</button></sc-if>
    <sc-if value="{{sale}}" hint-placeholder-val="{{false}}"><button type="button" class="pill" onClick="{{dropSale}}">On sale ✕</button></sc-if>
  </div>

  <div style="padding: 10px 12px 96px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="6">
      <a href="ProductMobile.dc.html" class="pc">
        <span class="ph" style="height: 120px; position: relative">[Image]<sc-if value="{{p.sale}}" hint-placeholder-val="{{false}}"><span class="badge b-sale" style="position: absolute; top: 6px; left: 6px">Sale</span></sc-if></span>
        <span style="font-weight: 600">{{p.name}}</span>
        <strong style="color: #0B1F3A">PKR [Price]</strong>
        <span class="badge {{p.stockCls}}" style="align-self: flex-start">{{p.stock}}</span>
      </a>
    </sc-for>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(11,31,58,.5); display: flex; align-items: flex-end; z-index: 5">
      <div role="dialog" aria-label="Filters" style="background: #FFFFFF; width: 100%; border-radius: 18px 18px 0 0; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 6px; position: sticky; bottom: 0">
        <div style="width: 40px; height: 4px; border-radius: 4px; background: #CBD5E1; align-self: center; margin-bottom: 6px"></div>
        <div style="display: flex; justify-content: space-between; align-items: center"><strong class="h" style="font-size: 19px">Filters</strong><button type="button" onClick="{{close}}" style="min-height: 44px; background: none; border: 0; font: inherit; color: #1A5FD6; font-weight: 600; cursor: pointer">Close</button></div>
        <strong style="font-size: 13px; margin-top: 6px">Availability</strong>
        <label class="ck"><input type="checkbox" checked="{{inStock}}" onChange="{{toggleStock}}">In stock only</label>
        <label class="ck"><input type="checkbox" checked="{{sale}}" onChange="{{toggleSale}}">On sale</label>
        <strong style="font-size: 13px; margin-top: 6px">Brand</strong>
        <label class="ck"><input type="checkbox">[Brand A]</label>
        <label class="ck"><input type="checkbox">[Brand B]</label>
        <strong style="font-size: 13px; margin-top: 6px">Price (PKR)</strong>
        <div style="display: flex; gap: 8px"><input aria-label="Minimum price" placeholder="[Min]" style="flex: 1; height: 44px; border: 1.5px solid #CBD5E1; border-radius: 10px; padding: 0 10px; font: inherit"><input aria-label="Maximum price" placeholder="[Max]" style="flex: 1; height: 44px; border: 1.5px solid #CBD5E1; border-radius: 10px; padding: 0 10px; font: inherit"></div>
        <div style="display: flex; gap: 8px; margin-top: 10px"><button type="button" class="btn bs" style="flex: 1" onClick="{{clear}}">Clear</button><button type="button" class="btn bp" style="flex: 2" onClick="{{close}}">Show {{count}} products</button></div>
      </div>
    </div>
  </sc-if>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 6px">
    <a class="nav" href="HomeMobile.dc.html">Home</a>
    <a class="nav" href="ShopMobile.dc.html" style="color: #1A5FD6">Categories</a>
    <a class="nav" href="CheckoutMobile.dc.html">Cart (2)</a>
    <a class="nav" href="TrackMobile.dc.html">Orders</a>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>window.__dcComponent = (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: true, inStock: false, sale: false };
  }
  renderVals() {
    const s = this.state;
    const P = (name, stock, sale) => ({ name, stock, sale: !!sale, stockCls: stock === 'In stock' ? 'b-in' : stock === 'Low stock' ? 'b-low' : 'b-out' });
    const all = [
      P('Soldering Station [Model TBC]', 'In stock'),
      P('Solder Wire [Diameter TBC]', 'In stock', true),
      P('Solder Paste / Flux [Type TBC]', 'Low stock'),
      P('BGA Reballing Stencil Set [TBC]', 'In stock'),
      P('Soldering Iron Tips [Set TBC]', 'Out of stock'),
      P('Desoldering Wick [Width TBC]', 'In stock', true)
    ];
    const items = all.filter(p => (!s.inStock || p.stock !== 'Out of stock') && (!s.sale || p.sale));
    const n = (s.inStock ? 1 : 0) + (s.sale ? 1 : 0);
    return {
      items, count: items.length,
      sheet: s.sheet, inStock: s.inStock, sale: s.sale,
      filterCount: n ? ' (' + n + ')' : '',
      open: () => this.setState({ sheet: true }),
      close: () => this.setState({ sheet: false }),
      toggleStock: () => this.setState({ inStock: !s.inStock }),
      toggleSale: () => this.setState({ sale: !s.sale }),
      dropStock: () => this.setState({ inStock: false }),
      dropSale: () => this.setState({ sale: false }),
      clear: () => this.setState({ inStock: false, sale: false })
    };
  }
}
return Component;
})();</script>
</body>
</html>
